<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moon Crisis: เอาชีวิตรอดบนดวงจันทร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/hud.css">
<link rel="stylesheet" href="css/overlays.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="m" id="mo" title="ออกซิเจน"><img data-ic="o2" alt="ออกซิเจน"><i><b id="bo"></b></i><em id="vo"></em></div>
    <div class="m" id="mp" title="พลังงาน"><img data-ic="bolt" alt="พลังงาน"><i><b id="bp"></b></i><em id="vp"></em></div>
    <div class="m" id="mh" title="ความแข็งแรงฐาน"><img data-ic="hull" alt="ความแข็งแรงฐาน"><i><b id="bh"></b></i><em id="vh"></em></div>
    <div id="tm" title="วัน">
      <img data-ic="moon" alt="วัน"><span id="tday"></span><small id="tclk"></small>
      <span id="trad" class="hide" title="เหตุการณ์ถัดไป"><img data-ic="radar" alt="เรดาร์"><b id="trnum"></b></span>
    </div>
  </div>
  <div id="ban"></div>
  <div id="cw"><canvas id="c" width="960" height="660" aria-label="หน้าตัดฐานวิจัยบนดวงจันทร์"></canvas><div id="hint" role="status"></div></div>
  <div id="crew"></div>

  <div class="ov" id="menu">
    <h1>Moon Crisis</h1>
    <div id="mhero"></div>
    <div id="opts" role="group" aria-label="เลือกระยะเวลาเล่น">
      <button data-d="6"><span><img data-ic="clock" alt=""><b>3</b> นาที</span><small><img class="sm" data-ic="moon" alt=""> 6</small></button>
      <button data-d="10" class="sel"><span><img data-ic="clock" alt=""><b>5</b> นาที</span><small><img class="sm" data-ic="moon" alt=""> 10</small></button>
      <button data-d="16"><span><img data-ic="clock" alt=""><b>8</b> นาที</span><small><img class="sm" data-ic="moon" alt=""> 16</small></button>
    </div>
    <button id="go">เริ่ม</button>
  </div>
  <div class="ov glass hide" id="tut"><div class="panel">
    <canvas id="tart" width="480" height="224"></canvas>
    <h2 id="tt"></h2><p id="tp"></p><div class="dots" id="td"></div>
    <div class="row"><button id="tprev" aria-label="ย้อนกลับ">◀</button><button id="tskip">ข้าม</button><button id="tnext" aria-label="ต่อไป">▶</button></div>
  </div></div>
  <div class="ov glass hide" id="cards"><h1 style="font-size:clamp(22px,5vw,34px)">ห้องใหม่</h1><div id="cday"></div><div id="cardbox"></div></div>
  <div class="ov hide" id="end">
    <h1 id="et"></h1>
    <div id="ed"></div>
    <button id="again">เล่นอีก</button>
  </div>
</div>

<!-- ลำดับการโหลดสำคัญ: ไฟล์ด้านบนต้องมาก่อนไฟล์ที่ใช้มัน -->
<!-- core: เครื่องมือพื้นฐาน -->
<script src="js/core/utils.js"></script>
<!-- config: ข้อมูลคงที่ -->
<script src="js/config/palette.js"></script>
<script src="js/config/icons.js"></script>
<script src="js/config/constants.js"></script>
<script src="js/config/rooms.js"></script>
<script src="js/config/text.js"></script>
<!-- graphics: แปลงไอคอนเป็นภาพ (ต้องก่อน ui) -->
<script src="js/graphics/icons.js"></script>
<!-- core: state ของเกม -->
<script src="js/core/state.js"></script>
<!-- graphics + animation -->
<script src="js/graphics/canvas.js"></script>
<script src="js/animation/ambient.js"></script>
<script src="js/animation/effects.js"></script>
<script src="js/animation/crew-sprite.js"></script>
<script src="js/graphics/background.js"></script>
<script src="js/graphics/room-props.js"></script>
<script src="js/graphics/structure.js"></script>
<script src="js/graphics/labels.js"></script>
<script src="js/graphics/renderer.js"></script>
<!-- systems: กติกาเกม -->
<script src="js/systems/crew.js"></script>
<script src="js/systems/events.js"></script>
<script src="js/systems/resources.js"></script>
<script src="js/systems/room-builder.js"></script>
<!-- ui + input -->
<script src="js/ui/hud.js"></script>
<script src="js/ui/tutorial-art.js"></script>
<script src="js/ui/screens.js"></script>
<script src="js/ui/cards.js"></script>
<script src="js/ui/tutorial.js"></script>
<script src="js/input/pointer.js"></script>
<script src="js/input/keyboard.js"></script>
<!-- core: วนลูปและเริ่มเกม -->
<script src="js/core/game.js"></script>
<script src="js/core/main.js"></script>
</body>
</html>
